# GH actions
name: CI/CD Pipeline

on:
  # Permite ejecutar el workflow manualmente
  workflow_dispatch:
  # Se ejecuta con cada push a la rama main
  push:
    branches:
      - main

jobs:
  # Job de pruebas unitarias
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test

  # Job de análisis de calidad con SonarCloud
  sonar:
    name: SonarCloud analysis
    # Solo se ejecuta si las pruebas pasan
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo para que Sonar calcule el código nuevo
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project
        run: mvn -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar