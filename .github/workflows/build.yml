# Nombre del workflow
name: CI/CD Pipeline

on:
  # Permite ejecutar el workflow manualmente
  workflow_dispatch:
  # Push a main y a la rama de trabajo
  push:
    branches:
      - main
      - feature/health-endpoint
  # Pull requests hacia main
  pull_request:
    branches:
      - main

jobs:
  # 1. Pruebas unitarias
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test

  # 2. Análisis de calidad con SonarCloud
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project
        run: mvn -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # 3. Construcción del artefacto JAR
  build:
    name: Build
    needs: sonar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Sube el JAR para compartirlo con los siguientes jobs
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: lab2p2026-jar
          path: target/lab12026p.jar

  # 4. Construcción y publicación de la imagen en Docker Hub
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Descarga el JAR generado por el job "build"
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: lab2p2026-jar
          path: target

      # Permite construir la imagen para varias arquitecturas
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 para la nube y arm64 para tu Mac
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lab2p2026:latest
            ${{ secrets.DOCKER_USERNAME }}/lab2p2026:${{ github.sha }}
  # 5. Despliegue en Render (solo si la imagen se publicó correctamente)
  deploy:
    name: Deploy to Render
    needs: docker
    runs-on: ubuntu-latest
    steps:
      # Le pide a Render que descargue la imagen nueva y la despliegue
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"