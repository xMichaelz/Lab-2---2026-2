# GH Actions
name: CI/CD Pipeline

on:
  # Permite ejecutar el workflow manualmente
  workflow_dispatch:
  # Se ejecuta con cada push a la rama main
  push:
    branches:
      - main

jobs:
  # Job de pruebas unitarias
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Instala JDK 17 y activa la caché de Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Ejecuta las pruebas (usan H2 en memoria, no necesitan MySQL)
      - name: Run Tests
        run: mvn -B test